# coda-score Style Taxonomy
# Multi-dimensional annotation schema for modern music score images

periods:
  early_modern:
    label: "Early Modern"
    years: "1900-1945"
  post_war:
    label: "Post-War Avant-Garde"
    years: "1945-1970"
  late_20th:
    label: "Late 20th Century"
    years: "1970-2000"
  contemporary:
    label: "Contemporary"
    years: "2000-"

techniques:
  - serialism
  - integral_serialism
  - spectralism
  - stochastic
  - algorithmic
  - minimalism
  - post_minimalism
  - graphic_notation
  - text_score
  - proportional_notation
  - extended_techniques
  - microtonality
  - new_complexity
  - aleatoric
  - indeterminate
  - electronic
  - spatial_music
  - pointillism
  - collage
  - polystylism

instrumentation:
  solo: [piano, violin, cello, flute, clarinet, guitar, voice, percussion]
  chamber: [duo, trio, quartet, quintet, ensemble]
  large: [orchestral, choral, wind_ensemble]
  electronic: [tape, live_electronics, mixed]

notation_types:
  - traditional
  - proportional
  - graphic
  - text_score
  - mixed
  - tablature

page_types: [full_page, system, fragment, cover]
source_types: [scan, render, photo]
