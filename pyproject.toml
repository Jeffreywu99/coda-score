[project]
name = "coda-score"
version = "0.3.0"
description = "Graphical modern music score generation via diffusion models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML — RTX 5060/5080 Blackwell (sm_120) needs torch >= 2.7.0 + CUDA 12.8
    # Note: PyTorch 2.12+ deprecated cu128 wheels; use <2.12 to get cu128 variants
    "torch>=2.7.0,<2.12",
    "torchvision>=0.22.0,<0.27",
    "diffusers>=0.32.0",
    "transformers>=4.48.0",
    "accelerate>=1.2.0",
    "peft>=0.14.0",
    "safetensors>=0.5.0",
    # 8-bit optimizer for memory-constrained training
    "bitsandbytes>=0.45.0",
    # Image processing
    "opencv-python>=4.10.0",
    "Pillow>=11.0.0",
    # Data & config
    "pyyaml>=6.0",
    "click>=8.1.0",
    "tqdm>=4.67.0",
    # PDF → image conversion
    "pymupdf>=1.25.0",
    # Experiment tracking
    "wandb>=0.19.0",
    # Super resolution (Phase 2)
    # "realesrgan>=0.3.0",
    # Web UI (Phase 2)
    # "gradio>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "jupyter>=1.1.0",
]

[project.scripts]
coda-generate = "inference.generate:main"
coda-train = "models.train_lora:main"
coda-label = "data.scripts.label:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "models", "inference", "data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
url = "https://pypi.org/simple"
