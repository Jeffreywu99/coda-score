# LoRA training config for Boulez orchestral works
# Phase 0: Concept validation — RTX 5060 Ti 16GB at 1024x1024

model:
  base: "stabilityai/stable-diffusion-xl-base-1.0"
  variant: "fp16"

lora:
  rank: 32          # 16-64, scores have simple texture
  alpha: 16         # typically half of rank
  dropout: 0.05
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

training:
  resolution: 1024
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: "constant_with_warmup"
  lr_warmup_steps: 100
  max_steps: 2500
  mixed_precision: "bf16"
  optimizer: "adamw_8bit"    # bitsandbytes 8-bit AdamW
  gradient_checkpointing: true
  max_grad_norm: 1.0
  seed: 42

data:
  train_dir: "data/processed/boulez/"
  metadata_file: "data/metadata/annotations/boulez.json"
  trigger_word: "in the style of Boulez"

output:
  dir: "weights/lora/"
  name: "coda-score-boulez"
  save_every_n_steps: 500

validation:
  enabled: true
  every_n_steps: 500
  resolution: 1024
  steps: 30
  cfg: 7.0
  prompts:
    - "contemporary classical music score, in the style of Boulez, for orchestra, serial composition, black ink on white paper"
    - "modern avant-garde orchestral score, in the style of Boulez, dense atonal notation, complex rhythms"
    - "contemporary classical music score, black ink on white paper, traditional engraving"
